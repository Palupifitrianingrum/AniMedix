services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: animedix
      POSTGRES_PASSWORD: animedix
      POSTGRES_DB: animedix
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://animedix:animedix@db:5432/animedix
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      - db
